name: Publish BuildingRegistry to GitHub Pages

# Allow this workflow to be run manually and ensure the GITHUB_TOKEN has write rights
permissions:
  contents: write
  pages: write

on:
  push:
    paths:
      - 'Stamped! A City Passport/Resources/BuildingRegistry.json'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Copy registry into docs
        run: |
          mkdir -p docs/v1
          cp "Stamped! A City Passport/Resources/BuildingRegistry.json" docs/v1/registry.json

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
